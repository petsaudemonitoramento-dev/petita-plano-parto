<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Petita — homologação de login</title><style>
:root{font:16px system-ui;color:#143d63;background:#f8f3f5}main{max-width:480px;margin:36px auto;padding:24px;background:white;border-radius:18px}h1{font-size:24px}label{display:block;margin:12px 0}input{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #aab5bc;border-radius:8px;font:inherit}button{padding:10px;margin:4px;border:1px solid #143d63;border-radius:8px;background:#143d63;color:white;font:inherit}button:disabled{opacity:.5}#status{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#555}
</style><script type="module" src="/auth-preview.js"></script></head><body><main><h1>Petita — teste de login</h1><p>Homologação interna. Use somente uma conta fictícia com e-mail de teste acessível. Não informe dados de saúde.</p><form id="auth"><label>Nome fictício<input id="name" autocomplete="off" maxlength="120"></label><label>E-mail de teste<input id="email" type="email" autocomplete="email" maxlength="254"></label><label>Senha<input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128"></label><button type="button" data-action="signup">Criar conta</button><button type="button" data-action="login">Entrar</button><label>Código de confirmação<input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></label><button type="button" data-action="resend">Reenviar código</button><button type="button" data-action="verify">Confirmar e-mail</button><hr><button type="button" data-action="session">Verificar sessão</button><button type="button" data-action="profile">Criar/verificar perfil</button><button type="button" data-action="logout">Sair</button></form><p id="status" role="status" aria-live="polite">Carregando…</p><small>Sem registro de senha, código, token ou dados de saúde nesta página. A autenticação é gerenciada pelo Neon.</small></main></body></html>
