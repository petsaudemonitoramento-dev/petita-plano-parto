name: Verificar Pull Request Petita

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-web:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Instalar dependências
        run: flutter pub get --enforce-lockfile
      - name: Analisar código
        run: flutter analyze --no-pub
      - name: Executar testes offline
        run: flutter test --no-pub
      - name: Validar estrutura do questionário
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('assets/data/birth_plan_flow.json').read_text(encoding='utf-8'))
          assert data, 'Fluxo vazio'
          ids = [item['id'] for item in data]
          assert len(ids) == len(set(ids)), 'IDs duplicados'
          for item in data:
              assert item['question'] and item['section'], item
              assert isinstance(item['options'], list), item
          print(f'Questionário validado: {len(data)} perguntas')
          PY
      - name: Compilar web para detectar erros de código
        run: flutter build web --release --base-href "/petita-plano-parto/" --no-wasm-dry-run
