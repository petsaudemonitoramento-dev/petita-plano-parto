name: Validar API Neon canônica (sem deploy)
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/validar_backend_neon_canonico.yml'
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm run check
      - run: npm test
      - run: npm run build:auth
