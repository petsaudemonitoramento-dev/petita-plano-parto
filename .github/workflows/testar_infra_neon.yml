name: Testar fundação Neon isolada

on:
  pull_request:
    branches: [main, infra/neon-identidade-rls]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-authorization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preservar bytes do questionário canônico
        run: python3 tools/check_frozen_questionnaire.py
      - name: Validar sintaxe do runner Python
        run: python3 -m py_compile tools/test_neon_foundation.py tools/check_frozen_questionnaire.py
      - name: Aplicar migração e testar autorização em PostgreSQL descartável
        run: bash tool/run_bounded_audit.sh postgres-suite 180 python3 tools/test_neon_foundation.py
      - name: Testar dúvidas, aprovação, concorrência e interrupção
        run: bash tool/run_bounded_audit.sh postgres-suite 180 python3 tools/test_neon_workflows.py
      - name: Testar cadastro, consentimento e isolamento de planos
        run: bash tool/run_bounded_audit.sh postgres-suite 180 python3 tools/test_neon_enrollment_sync.py
      - name: Testar vínculo UBS de gestantes e regressão de cadastro/consentimento
        run: bash tool/run_bounded_audit.sh postgres-patient-ubs 180 python3 tools/test_neon_patient_ubs.py
