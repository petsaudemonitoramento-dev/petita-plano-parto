name: Testar compilação APK Android da Petita

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/testar_apk_android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Flutter 3.44.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Validar lockfile Web original
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Gerar plataforma Android temporária
        run: |
          set -eu
          test ! -d android
          test ! -e test/widget_test.dart
          test ! -e analysis_options.yaml
          flutter create --platforms=android --project-name plano_parto_pet_saude --no-pub .
          test -f android/app/src/main/AndroidManifest.xml
          # Remover apenas os dois exemplos gerados pela ferramenta, não o app.
          rm -f test/widget_test.dart analysis_options.yaml
          git diff --exit-code -- pubspec.yaml
          echo 'Scaffold Android gerado apenas neste runner.'

      - name: Resolver dependências específicas do Android, apenas no runner
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.yaml
          echo 'Alterações temporárias necessárias no lockfile para Android:'
          git diff --stat -- pubspec.lock || true
          echo 'O lockfile do repositório NÃO é atualizado por este workflow.'

      - name: Instalar leitor de PDFs para os testes
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdffonts >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi

      - name: Analisar código
        run: flutter analyze --no-pub

      - name: Executar 67 testes offline
        run: flutter test --no-pub

      - name: Compilar APK de depuração
        run: flutter build apk --debug --no-pub

      - name: Conferir integridade do APK
        run: |
          set -eu
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
          du -h build/app/outputs/flutter-apk/app-debug.apk

      - name: Disponibilizar APK como artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: petita-apk-debug-teste
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
