name: Testar compilação APK Android da Petita

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/testar_apk_android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Flutter 3.44.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Gerar plataforma Android temporariamente para teste
        run: |
          set -eu
          test ! -d android
          flutter create --platforms=android --project-name plano_parto_pet_saude --no-pub .
          test -f android/app/src/main/AndroidManifest.xml
          echo 'Android gerado apenas neste runner; nenhum arquivo será integrado à main.'

      - name: Instalar dependências com lockfile preservado
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Instalar leitor de PDFs se necessário para os testes
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdffonts >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi

      - name: Analisar código
        run: flutter analyze --no-pub

      - name: Executar testes offline
        run: flutter test --no-pub

      - name: Compilar APK de depuração
        run: flutter build apk --debug --no-pub

      - name: Conferir integridade do APK
        run: |
          set -eu
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
          du -h build/app/outputs/flutter-apk/app-debug.apk

      - name: Disponibilizar APK apenas como artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: petita-apk-debug-teste
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
