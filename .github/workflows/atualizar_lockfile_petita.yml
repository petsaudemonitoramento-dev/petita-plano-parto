name: Resolver lockfile Petita (temporario)
on:
  push:
    branches: ['feat/cards-consulta-pdf-voz-20261104']
    paths: ['.github/workflows/atualizar_lockfile_petita.yml']
permissions:
  contents: write
jobs:
  atualizar-lockfile:
    if: github.repository == 'petsaudemonitoramento-dev/petita-plano-parto'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cards-consulta-pdf-voz-20261104
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Resolver dependencias, sem build ou segredos
        run: flutter pub get
      - name: Versionar somente pubspec.lock na branch de homologacao
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock ja estava atualizado"
            exit 0
          fi
          git config user.name "petita-lockfile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: atualizar pubspec.lock para flutter_tts"
          git push origin HEAD:refs/heads/feat/cards-consulta-pdf-voz-20261104
