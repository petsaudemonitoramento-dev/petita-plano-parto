name: Validar iOS simulador (sem assinar ou publicar)
on:
  pull_request:
    paths: ['lib/**', 'pubspec.*', 'tool/prepare_homologation_platforms.py', '.github/workflows/validar_ios_homologacao.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependências travadas
        run: bash tool/run_bounded_audit.sh ios-pub 180 flutter pub get --enforce-lockfile
      - name: Estrutura iOS isolada e identificador de homologação
        run: |
          bash tool/run_bounded_audit.sh ios-scaffold 180 flutter create --platforms=ios --project-name plano_parto_pet_saude --org br.edu.ufcg.petsaude .
          python3 tool/prepare_homologation_platforms.py ios
      - name: Compilar para simulador, sem assinatura
        run: bash tool/run_bounded_audit.sh ios-simulator 900 flutter build ios --simulator --debug --no-codesign --no-pub --dart-define-from-file=config/homologacao.json
